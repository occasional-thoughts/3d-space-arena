spring.datasource.url=jdbc:mysql://mysql:3306/arena?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${MYSQL_USER:arena}
spring.datasource.password=${MYSQL_PASSWORD:arena}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update

arena.public-ws-url=${PUBLIC_WS_URL:ws://localhost:8080/game}
