server.port=8080
spring.application.name=space-arena

# Default profile: in-memory H2, so `mvn spring-boot:run` works with nothing
# else installed. The docker profile below points at MySQL instead.
spring.datasource.url=jdbc:h2:mem:arena;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

arena.public-ws-url=ws://localhost:8080/game
logging.level.com.arena=INFO
